name: Build Debian 7 Wheezy ARMEL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HTC HD2 Debian Wheezy ARMEL rootfs
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable third-party APT repositories
        run: |
          echo "==> Disabling third-party APT repositories"

          if [ -d /etc/apt/sources.list.d ]; then
            sudo find /etc/apt/sources.list.d \
              -type f \
              \( -name "*.list" -o -name "*.sources" \) \
              -exec sh -c '
                for file do
                  mv "$file" "$file.disabled"
                done
              ' sh {} +
          fi

      - name: Configure build resolver
        run: |
          sudo cp -L /etc/resolv.conf /etc/resolv.conf.github-actions.backup
          sudo rm -f /etc/resolv.conf

          sudo tee /etc/resolv.conf > /dev/null <<'EOF'
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          EOF

          sudo chmod 644 /etc/resolv.conf

          echo "=== Resolver ==="
          cat /etc/resolv.conf

          echo
          echo "=== DNS test ==="
          getent hosts archive.debian.org || true
          getent hosts deb.debian.org || true

      - name: Clean APT cache
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            rsync \
            xz-utils \
            tar \
            gzip \
            e2fsprogs \
            xxd \
            android-sdk-libsparse-utils

      - name: Enable ARM emulation
        run: |
          sudo update-binfmts --enable qemu-arm || true

          if [ ! -x /usr/bin/qemu-arm-static ]; then
            echo "ERROR: qemu-arm-static is not available."
            exit 1
          fi

          file /usr/bin/qemu-arm-static

      - name: Check tools
        run: |
          debootstrap --version

          echo
          echo "=== img2simg ==="
          img2simg --help 2>&1 | head -5 || true

          echo
          echo "=== simg2img ==="
          simg2img --help 2>&1 | head -5 || true

          echo
          echo "=== xxd ==="
          xxd -h 2>&1 | head -3 || true

      - name: Make build script executable
        run: |
          chmod +x scripts/build-wheezy-armel.sh

      - name: Build Debian Wheezy ARMEL rootfs
        run: |
          sudo scripts/build-wheezy-armel.sh

      - name: Verify rootfs
        run: |
          echo "============================================================"
          echo " Verifying rootfs"
          echo "============================================================"

          sudo test -d output/rootfs
          sudo test -x output/rootfs/sbin/init
          sudo test -f output/rootfs/etc/debian_version
          sudo test -f output/rootfs/etc/htc-hd2-build-info

          echo
          echo "=== Debian version ==="
          sudo cat output/rootfs/etc/debian_version

          echo
          echo "=== Build info ==="
          sudo cat output/rootfs/etc/htc-hd2-build-info

          echo
          echo "=== Init ==="
          sudo ls -l output/rootfs/sbin/init

          echo
          echo "=== Architecture ==="
          sudo file output/rootfs/sbin/init

      # =========================================================
      # 0. Chown output/ về runner — fix quyền ghi
      # =========================================================
      - name: Take ownership of output directory
        run: |
          echo "==> Fixing output ownership"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -la output/

      # =========================================================
      # 1. Tạo ext4 raw image (.ext4)
      # =========================================================
      - name: Create rootfs.ext4 (raw ext4 image)
        run: |
          echo "============================================================"
          echo " Creating rootfs.ext4 (raw ext4)"
          echo "============================================================"

          set -euo pipefail

          ROOTFS_SIZE_MB=4096
          IMAGE="output/rootfs.ext4"
          MOUNT_POINT="/tmp/rootfs-ext4"

          echo "==> Image size: ${ROOTFS_SIZE_MB} MB"

          sudo mkdir -p "$MOUNT_POINT"

          echo "==> Allocating image"
          sudo dd \
            if=/dev/zero \
            of="$IMAGE" \
            bs=1M \
            count="$ROOTFS_SIZE_MB" \
            status=progress

          echo "==> Creating ext4 filesystem"
          sudo mkfs.ext4 \
            -F \
            -L debian \
            -m 1 \
            "$IMAGE"

          echo "==> Mounting ext4 image"
          sudo mount -o loop "$IMAGE" "$MOUNT_POINT"

          echo "==> Copying Debian rootfs"
          sudo rsync \
            -aHAX \
            --numeric-ids \
            output/rootfs/ \
            "$MOUNT_POINT/"

          echo "==> Syncing filesystem"
          sudo sync

          echo "==> Unmounting image"
          sudo umount "$MOUNT_POINT"
          sudo rmdir "$MOUNT_POINT"

          echo "==> Checking ext4 filesystem (read-only, no repair)"
          sudo e2fsck -f -n "$IMAGE" || true

          echo "==> Fixing permissions and ownership"
          sudo chmod a+r "$IMAGE"
          sudo chown "$(id -u):$(id -g)" "$IMAGE"

          echo
          echo "=== rootfs.ext4 ==="
          ls -lh "$IMAGE"
          du -h "$IMAGE"
          file "$IMAGE"

      # =========================================================
      # 2. Tạo Android sparse image (.img) — CHUẨN
      # =========================================================
      - name: Create rootfs.img (Android sparse image)
        run: |
          echo "============================================================"
          echo " Creating rootfs.img (Android sparse image)"
          echo "============================================================"

          set -euo pipefail

          SRC="output/rootfs.ext4"
          DST="output/rootfs.img"

          echo "==> Checking img2simg"

          if ! command -v img2simg >/dev/null 2>&1; then
            echo "ERROR: img2simg not found."
            echo "Install android-sdk-libsparse-utils."
            exit 1
          fi

          echo "==> Source image info"
          ls -lh "$SRC"
          du -h "$SRC"

          echo "==> Converting raw ext4 -> Android sparse"
          img2simg "$SRC" "$DST"

          chmod a+r "$DST"

          echo
          echo "=== rootfs.img ==="
          ls -lh "$DST"
          du -h "$DST"

          echo
          echo "=== file ==="
          file "$DST"

          echo
          echo "=== Magic bytes ==="
          xxd -l 16 "$DST"

          echo
          echo "==> Asserting Android sparse magic"

          MAGIC=$(xxd -p -l 4 "$DST")

          if [ "$MAGIC" != "3aff26ed" ]; then
            echo "ERROR: invalid sparse magic: $MAGIC (expected: 3aff26ed)"
            exit 1
          fi

          echo "OK: magic = $MAGIC"

      # =========================================================
      # 3. Verify: sparse image phải convert ngược lại được
      # =========================================================
      - name: Verify rootfs.img (round-trip)
        run: |
          echo "============================================================"
          echo " Verifying rootfs.img (round-trip)"
          echo "============================================================"

          set -euo pipefail

          echo "==> Round-trip: simg2img -> so sánh với ext4 gốc"

          rm -f /tmp/rootfs-roundtrip.ext4
          simg2img output/rootfs.img /tmp/rootfs-roundtrip.ext4

          echo "==> SHA256 so sánh"

          SHA_ORIG=$(sha256sum output/rootfs.ext4 | awk '{print $1}')
          SHA_RT=$(sha256sum /tmp/rootfs-roundtrip.ext4 | awk '{print $1}')

          echo "ext4 gốc   : $SHA_ORIG"
          echo "round-trip : $SHA_RT"

          if [ "$SHA_ORIG" != "$SHA_RT" ]; then
            echo "ERROR: round-trip mismatch!"
            exit 1
          fi

          echo
          echo "==> OK: rootfs.img là sparse image hợp lệ"

          echo
          echo "==> Mount thử round-trip image"

          TEST_MNT="/tmp/verify-img"
          sudo mkdir -p "$TEST_MNT"

          sudo mount -o loop,ro /tmp/rootfs-roundtrip.ext4 "$TEST_MNT"

          echo "--- /etc/debian_version ---"
          sudo cat "$TEST_MNT/etc/debian_version"

          echo "--- /sbin/init ---"
          sudo ls -l "$TEST_MNT/sbin/init"

          sudo umount "$TEST_MNT"
          sudo rmdir "$TEST_MNT"

          rm -f /tmp/rootfs-roundtrip.ext4

      # =========================================================
      # 4. Tạo checksum riêng cho từng file
      # =========================================================
      - name: Generate checksums
        run: |
          echo "==> Generating SHA256 checksums"

          set -euo pipefail

          cd output

          sha256sum rootfs.ext4 > rootfs.ext4.sha256
          sha256sum rootfs.img  > rootfs.img.sha256
          sha256sum rootfs.ext4 rootfs.img > SHA256SUMS

          chmod a+r rootfs.ext4.sha256 rootfs.img.sha256 SHA256SUMS

          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

          echo
          echo "=== rootfs.ext4.sha256 ==="
          cat rootfs.ext4.sha256

          echo
          echo "=== rootfs.img.sha256 ==="
          cat rootfs.img.sha256

      - name: Show result
        run: |
          echo "============================================================"
          echo " Build result"
          echo "============================================================"

          echo
          echo "=== Output files ==="
          ls -lh output/

          echo
          echo "=== rootfs.ext4 ==="
          file output/rootfs.ext4
          du -h output/rootfs.ext4

          echo
          echo "=== rootfs.img ==="
          file output/rootfs.img
          du -h output/rootfs.img

          echo
          echo "=== Magic rootfs.img ==="
          xxd -l 16 output/rootfs.img

          echo
          echo "=== SHA256 ==="
          cat output/SHA256SUMS

      # =========================================================
      # 5. Upload artifact RIÊNG cho .ext4
      # =========================================================
      - name: Upload rootfs.ext4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-wheezy-armel-rootfs-ext4
          path: |
            output/rootfs.ext4
            output/rootfs.ext4.sha256
          if-no-files-found: error
          compression-level: 0

      # =========================================================
      # 6. Upload artifact RIÊNG cho .img
      # =========================================================
      - name: Upload rootfs.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-wheezy-armel-rootfs-img
          path: |
            output/rootfs.img
            output/rootfs.img.sha256
          if-no-files-found: error
          compression-level: 0

      # =========================================================
      # 7. Upload artifact tổng hợp (cả 2 + SHA tổng)
      # =========================================================
      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-wheezy-armel-rootfs-all
          path: |
            output/rootfs.ext4
            output/rootfs.img
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0