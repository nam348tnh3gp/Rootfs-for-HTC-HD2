name: Build Debian 7 Wheezy ARMEL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HTC HD2 Debian Wheezy ARMEL rootfs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable third-party APT repositories
        run: |
          echo "==> Disabling third-party APT repositories"

          if [ -d /etc/apt/sources.list.d ]; then
            sudo find /etc/apt/sources.list.d \
              -type f \
              \( -name "*.list" -o -name "*.sources" \) \
              -exec sh -c '
                for file do
                  mv "$file" "$file.disabled"
                done
              ' sh {} +
          fi

          echo "==> Remaining APT sources:"
          grep -Rhs \
            -E '^[[:space:]]*(deb|Types:)' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d \
            2>/dev/null || true

      - name: Clean APT cache
        run: |
          echo "==> Cleaning Ubuntu APT cache"

          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial

      - name: Install build dependencies
        run: |
          echo "==> Updating Ubuntu package lists"

          sudo apt-get update

          echo "==> Installing build dependencies"

          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            rsync \
            xz-utils \
            tar \
            gzip \
            e2fsprogs

      - name: Enable ARM emulation
        run: |
          echo "==> Enabling QEMU ARM"

          sudo update-binfmts --enable qemu-arm || true

          if [ ! -x /usr/bin/qemu-arm-static ]; then
            echo "ERROR: qemu-arm-static is not available."
            exit 1
          fi

          echo "==> QEMU ARM:"
          file /usr/bin/qemu-arm-static

      - name: Check debootstrap
        run: |
          echo "==> Checking debootstrap"

          debootstrap --version

      - name: Make build script executable
        run: |
          chmod +x scripts/build-wheezy-armel.sh

      - name: Build Debian Wheezy ARMEL rootfs
        run: |
          echo "==> Starting Debian Wheezy ARMEL rootfs build"

          sudo scripts/build-wheezy-armel.sh

      - name: Verify rootfs
        run: |
          echo "============================================================"
          echo " Verifying rootfs"
          echo "============================================================"

          sudo test -d output/rootfs
          sudo test -x output/rootfs/sbin/init
          sudo test -f output/rootfs/etc/debian_version
          sudo test -f output/rootfs/etc/htc-hd2-build-info

          echo
          echo "=== Debian version ==="
          sudo cat output/rootfs/etc/debian_version

          echo
          echo "=== Build info ==="
          sudo cat output/rootfs/etc/htc-hd2-build-info

          echo
          echo "=== Init ==="
          sudo ls -l output/rootfs/sbin/init

          echo
          echo "=== Architecture ==="
          sudo file output/rootfs/sbin/init

      - name: Create rootfs.ext4
        run: |
          echo "============================================================"
          echo " Creating rootfs.ext4"
          echo "============================================================"

          ROOTFS_SIZE_MB=2048
          IMAGE="output/rootfs.ext4"
          MOUNT_POINT="/tmp/rootfs-ext4"

          echo "==> Image size: ${ROOTFS_SIZE_MB} MB"

          sudo mkdir -p "$MOUNT_POINT"

          echo "==> Allocating image"

          sudo dd \
            if=/dev/zero \
            of="$IMAGE" \
            bs=1M \
            count="$ROOTFS_SIZE_MB" \
            status=progress

          echo "==> Creating ext4 filesystem"

          sudo mkfs.ext4 \
            -F \
            -L debian \
            "$IMAGE"

          echo "==> Mounting ext4 image"

          sudo mount \
            -o loop \
            "$IMAGE" \
            "$MOUNT_POINT"

          echo "==> Copying Debian rootfs"

          sudo cp -a \
            output/rootfs/. \
            "$MOUNT_POINT/"

          echo "==> Syncing filesystem"

          sudo sync

          echo "==> Unmounting image"

          sudo umount "$MOUNT_POINT"

          sudo rmdir "$MOUNT_POINT"

          echo "==> Checking ext4 filesystem"

          sudo e2fsck \
            -f \
            -p \
            "$IMAGE" || true

          sudo chmod a+r "$IMAGE"

          echo
          echo "=== rootfs.ext4 ==="
          ls -lh "$IMAGE"

          echo
          echo "=== Filesystem ==="
          sudo file "$IMAGE"

      - name: Generate checksum
        run: |
          echo "==> Generating SHA256 checksum"

          sudo sha256sum \
            output/rootfs.ext4 \
            | sudo tee output/SHA256SUMS > /dev/null

          echo
          echo "=== SHA256SUMS ==="
          sudo cat output/SHA256SUMS

      - name: Fix output permissions
        run: |
          echo "==> Fixing output permissions"

          sudo chmod -R a+rX output

          echo
          echo "=== Output ==="
          ls -lh output/

      - name: Show result
        run: |
          echo "============================================================"
          echo " Build result"
          echo "============================================================"

          echo
          echo "=== Output files ==="
          ls -lh output/

          echo
          echo "=== rootfs.ext4 size ==="
          du -h output/rootfs.ext4

          echo
          echo "=== SHA256 ==="
          cat output/SHA256SUMS

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@v4
        with:
          name: debian-wheezy-armel-rootfs
          path: |
            output/rootfs.ext4
            output/SHA256SUMS
          if-no-files-found: error